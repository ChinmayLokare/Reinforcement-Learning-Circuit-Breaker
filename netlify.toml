[build]
  command = "curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 9.0 && export PATH=\"$HOME/.dotnet:$PATH\" && dotnet publish CircuitBreakerDemo.Web/CircuitBreakerDemo.Web.csproj -c Release -o publish"
  publish = "publish/wwwroot"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200